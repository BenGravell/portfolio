<style>
:root {
  --pub-primary:    #026bac; /* site primary blue */
  --pub-link:       #1558d6; /* interactive link blue */
  --pub-link-bg:    #e8f0fe; /* tint of --pub-link for chip backgrounds */
  --pub-border:     #e0e0e0; /* dividers, chip outlines, figure borders */
  --pub-ink:        #1a1a1a; /* near-black: title text, year badge */
}

.pub-section {
  display: flex; align-items: center; gap: 0.55rem; width: fit-content;
  margin: 0.45rem 0 0.25rem;
  background: #f5f7fa; border-radius: 10px;
  padding: 0.55rem 0.75rem;
}
.pub-section-icon {
  flex-shrink: 0; width: 15px; height: 15px;
  fill: #9aa5b1;
}
.pub-section-description {
  align-items: flex-start;
  width: auto;
}
.pub-section-description .pub-section-icon { margin-top: 0.15rem; }
.author-chips { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; margin: 0; }
.pub-links { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0; }
.pub-links-kb { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 0.5rem; }
.chip {
  display: inline-flex; align-items: center;
  padding: 0.2rem 0.75rem; border-radius: 999px;
  font-size: 0.82rem; font-weight: 500; text-decoration: none !important;
  white-space: nowrap; transition: filter 0.12s;
}
.chip:hover { filter: brightness(0.9); text-decoration: none !important; }
.chip-link { background: var(--pub-link-bg); color: var(--pub-link); }
.chip-kb {
  background: linear-gradient(135deg, #007a8a 0%, #026bac 100%);
  color: #fff;
}
.chip-kb:hover { filter: brightness(1.12); }
.author-chip {
  display: inline-flex; align-items: center;
  background: #f8f9fa; border: 1px solid var(--pub-border); border-radius: 999px;
  font-size: 0.81rem; font-weight: 500; white-space: nowrap; overflow: hidden;
}
.author-chip a {
  display: inline-flex; align-items: center;
  padding: 0.18rem 0.6rem;
  text-decoration: none !important; color: #202124;
  transition: background-color 0.12s;
}
.author-chip a:hover { background-color: #e8e8e8; }
.author-chip .orcid-link {
  font-size: 0.72rem; color: #7c9a3a;
  border-left: 1px solid var(--pub-border); padding-left: 0.45rem; margin-left: 0;
}
.author-chip .orcid-link:hover { background-color: #eef6e0; }

/* Publication title */
.pub-title {
  font-size: 1.35rem; font-weight: 700; color: var(--pub-ink);
  line-height: 1.35; letter-spacing: -0.01em;
  margin: 0 0 0.5rem !important;
}

/* Venue + year row */
.pub-venue-row { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; margin: 0 0 0.1rem; }
.pub-venue-row .pub-section { margin: 0; }
.pub-venue { color: #555; font-size: 0.85rem; }
/* Two-column grid: metadata left, figure right */
.pub-grid {
  display: grid;
  grid-template-columns: 1fr minmax(120px, 220px);
  gap: 1.5rem 2rem;
  align-items: start;
  padding: 2rem 0;
  border-top: 1px solid var(--pub-border);
}
.pub-year-entries .pub-grid:last-child { border-bottom: 1px solid var(--pub-border); }
.pub-meta {
  border-left: 3px solid transparent;
  border-image: linear-gradient(180deg, #026bac 0%, #007a8a 60%, #00a896 100%) 1;
  padding-left: 1.1rem;
}
@media (max-width: 600px) {
  .pub-grid { grid-template-columns: 1fr; }
}

/* Figures */
.pub-figure {
  margin: 0 !important;
  display: block;
  cursor: zoom-in;
  max-width: 100%;
  align-self: start;
}
.pub-figure img {
  display: block;
  max-width: 100%;
  max-height: 190px;
  width: 100%;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--pub-border);
  transition: box-shadow 0.15s;
}
.pub-figure:hover img { box-shadow: 0 4px 18px rgba(0,0,0,0.18); }
.pub-figure figcaption { display: none; }
#pub-modal-caption {
  color: rgba(255,255,255,0.75);
  font-size: 0.85rem;
  font-style: italic;
  margin: 0.6rem 1rem 0;
  text-align: center;
  max-width: 80vw;
}

/* Modal */
#pub-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
#pub-modal.active { display: flex; }
#pub-modal-img-wrap {
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 90vw;
  max-height: 78vh;
}
#pub-modal-img {
  max-width: 90vw;
  max-height: 78vh;
  object-fit: contain;
  transform-origin: center center;
  transition: transform 0.15s ease;
  border-radius: 4px;
  user-select: none;
}
#pub-modal-controls {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}
.modal-btn {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px;
  padding: 0.35rem 1rem;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
  transition: background 0.12s;
}
.modal-btn:hover { background: rgba(255,255,255,0.28); }
#pub-modal-close {
  position: fixed;
  top: 1rem;
  right: 1.5rem;
  color: rgba(255,255,255,0.85);
  font-size: 2rem;
  cursor: pointer;
  background: none;
  border: none;
  line-height: 1;
  padding: 0.25rem 0.5rem;
}
#pub-modal-close:hover { color: #fff; }
</style>
