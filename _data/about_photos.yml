# Per-photo captions for the About page galleries (content/about.md).
#
# Key   = image filename (as it sits on disk under assets/images/about/…), quoted.
# Value = the caption shown in the lightbox (and used as the image alt text).
#
# Values are plain, UNQUOTED text — type captions verbatim. Spaces, apostrophes,
# commas, periods, and "double quotes" all work as-is, with no escaping and no
# surrounding quotes. Leading/trailing spaces are trimmed.
#
# Only two kinds of caption confuse YAML when written plainly: one that contains a
# colon followed by a space (e.g. "Stockholm: first snow"), or one that STARTS
# with punctuation like " # - ? [ {. For those, switch just that entry to a
# literal block, which accepts absolutely any characters:
#
#     "20250412_150959.jpg": |-
#       Stockholm: first snow
#
# Placeholders below are just the filename repeated — replace each value with a
# real caption when you're ready. Any photo without an entry here (or with an
# empty value) falls back to showing its filename, so new photos are safe to add
# without touching this file first.
