[workspace]
channels = ["conda-forge"]
name = "portfolio"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
ruby = "3.2.*"
nodejs = "*"
ffmpeg = "*"
poppler = "*"
libwebp = "*"
c-compiler = "*"
cxx-compiler = "*"
make = "*"
pkg-config = "*"

[tasks]
setup = "ruby dev/setup.rb"
build = "ruby -S bundle exec jekyll build"
serve = "ruby -S bundle exec jekyll serve"
check-map-data = "ruby dev/check-map-data.rb"
download-map-data = "ruby dev/download-map-data.rb"
convert-video = "ruby dev/convert-video-to-webp.rb"
check-journey = "node dev/check-journey.cjs"
check-about-media = { cmd = "ruby -S bundle exec ruby dev/check-about-media.rb", depends-on = ["build"] }
