<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">

  <!-- Ground rail -->
  <rect x="15" y="164" width="170" height="5" rx="2.5" fill="#026bac" opacity="0.3"/>

  <!-- Wheel left -->
  <circle cx="72" cy="165" r="11" stroke="#026bac" stroke-width="2.5" fill="#eaf4fb"/>
  <circle cx="72" cy="165" r="3.5" fill="#026bac"/>

  <!-- Wheel right -->
  <circle cx="128" cy="165" r="11" stroke="#026bac" stroke-width="2.5" fill="#eaf4fb"/>
  <circle cx="128" cy="165" r="3.5" fill="#026bac"/>

  <!-- Cart body -->
  <rect x="50" y="138" width="100" height="30" rx="7" fill="#026bac"/>

  <!-- Cart highlight -->
  <rect x="58" y="143" width="84" height="6" rx="3" fill="white" opacity="0.12"/>

  <!-- Swing-up trajectory arc: from hanging (down) sweeping to upright -->
  <!-- Arc center at pole pivot (100, 138), radius ~88 -->
  <!-- From angle 90deg (hanging, tip at 100,226) to 15deg from vertical (tip at ~123,53) -->
  <path d="M 100 226 A 88 88 0 0 1 123 51" fill="none" stroke="#026bac" stroke-width="1.8" stroke-dasharray="5,5" opacity="0.35"/>

  <!-- Pole (tilted ~25° from vertical, mid swing-up) -->
  <line x1="100" y1="138" x2="137" y2="53" stroke="#00a896" stroke-width="9" stroke-linecap="round"/>

  <!-- Pole pivot -->
  <circle cx="100" cy="138" r="5.5" fill="white" stroke="#00a896" stroke-width="2.5"/>

  <!-- Pole-tip ball -->
  <circle cx="137" cy="53" r="10" fill="#00a896"/>
  <circle cx="137" cy="53" r="5" fill="white" opacity="0.45"/>

  <!-- Force arrow pushing cart right -->
  <line x1="16" y1="153" x2="44" y2="153" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="44,147 57,153 44,159" fill="#f97316"/>

</svg>
