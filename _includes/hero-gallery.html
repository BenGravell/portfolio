<div class="bento-gallery" id="bento-gallery">
  <div class="gallery-main" id="gallery-main">
    <img id="gallery-main-img" src="" alt="" draggable="false">
  </div>
  <div class="gallery-caption">
    <a class="gallery-caption-title" id="gallery-title" href="#"></a>
    <span class="gallery-caption-subtitle" id="gallery-subtitle"></span>
  </div>
  <div class="bento-grid" id="bento-grid"></div>
</div>

<style>
/* ─── Outer container ─── */
.bento-gallery {
  width: 100%;
  position: relative;
}

/* ─── Main preview area ─── */
.gallery-main {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
  background: #0a0a0a;
  transition: background 0.2s ease;
}

.gallery-main img {
  position: absolute;
  inset: 36px;
  width: calc(100% - 72px);
  height: calc(100% - 72px);
  object-fit: contain;
  display: block;
  transition: opacity 0.18s ease;
}

.gallery-main img.fading {
  opacity: 0;
}

/* ─── Caption ─── */
.gallery-caption {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0 0.6rem;
  margin-top: 0.55rem;
  margin-bottom: 0.55rem;
  min-height: 1.5rem;
}

.gallery-caption-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
}

.gallery-caption-title:hover {
  text-decoration: underline;
  color: #fff;
}

.gallery-caption-subtitle {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.75);
}

/* ─── Bento card grid ─── */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

@media (max-width: 768px) {
  .bento-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ─── Individual card ─── */
.bento-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 12px 12px 16px;
  min-height: 0;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
}

.bento-card:hover {
  background: rgba(255, 255, 255, 0.13);
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-2px);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

.bento-card.active {
  background: rgba(0, 168, 150, 0.14);
  border-color: #00a896;
  box-shadow: 0 0 0 1px rgba(0, 168, 150, 0.3);
}

.bento-card.active:hover {
  background: rgba(0, 168, 150, 0.2);
  border-color: #00c4b0;
}

.bento-card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-align: center;
}

/* Progress bar on the active card, driven by --bar-w */
.bento-card-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 8px;
  width: var(--bar-w, 0%);
  background: linear-gradient(90deg, #00a896, #2ab3e7);
  border-radius: 0 1px 1px 0;
}
</style>

<script>
(function () {
  var DISPLAY_MS = 5000;

  var slides = [
    { title: "Nanotree",         subtitle: "Interactive Realtime Path Planning",                link: "/nanotree",                 bg: "#080808" },
    { title: "Treetop",          subtitle: "Interactive Realtime Trajectory Planning",          link: "/treetop",                  bg: "#080808" },
    { title: "Cartpole Control", subtitle: "Swing Up a Cartpole with Optimal Control",          link: "/cartpole-optimal-control", bg: "#ffffff" },
    { title: "Terra",            subtitle: "Personalized Country Recommender",                   link: "/terra",                    bg: "#ffffff" },
    { title: "Structura",        subtitle: "Design Physical Structures to be Light and Strong",  link: "/structura",                bg: "#ffffff" },
    { title: "Gestura",          subtitle: "Gesture Prediction from Time Series Data",           link: "/gestura",                  bg: "#ffffff" },
    { title: "Mosaic Maker",     subtitle: "Make Mosaics from Thousands of Images",             link: "/mosaic-maker",             bg: "#ffffff" },
    { title: "Coffee Finder",    subtitle: "Find Good Coffee Near You",                          link: "/coffee-finder",            bg: "#ffffff" }
  ];

  var gallery    = document.getElementById('bento-gallery');
  var mainArea   = document.getElementById('gallery-main');
  var mainImg    = document.getElementById('gallery-main-img');
  var titleEl    = document.getElementById('gallery-title');
  var subtitleEl = document.getElementById('gallery-subtitle');
  var grid       = document.getElementById('bento-grid');

  var cardEls = [];
  var current = 0;
  var paused  = false;

  /* ── Display update ── */
  function setDisplay(i) {
    var data   = slides[i];
    var newSrc = '{{ site.baseurl }}/assets/images/app' + data.link + '.png';
    titleEl.textContent    = data.title;
    titleEl.href           = '{{ site.baseurl }}' + data.link;
    subtitleEl.textContent = data.subtitle;
    mainArea.style.background = data.bg;

    if (mainImg.src === newSrc || mainImg.src === window.location.origin + newSrc) return;

    mainImg.classList.add('fading');
    setTimeout(function () {
      mainImg.src = newSrc;
      mainImg.alt = data.title;
      mainImg.onload  = function () { mainImg.classList.remove('fading'); };
      mainImg.onerror = function () { mainImg.classList.remove('fading'); };
    }, 180);
  }

  /* ── Build bento cards ── */
  slides.forEach(function (data, i) {
    var a = document.createElement('a');
    a.className = 'bento-card' + (i === 0 ? ' active' : '');
    a.href = '{{ site.baseurl }}' + data.link;
    a.setAttribute('aria-label', data.title + ': ' + data.subtitle);

    var t = document.createElement('div');
    t.className = 'bento-card-title';
    t.textContent = data.title;

    var bar = document.createElement('div');
    bar.className = 'bento-card-bar';

    a.appendChild(t);
    a.appendChild(bar);
    grid.appendChild(a);
    cardEls.push(a);

    /* Hover previews this card without changing current */
    a.addEventListener('mouseenter', function () { setDisplay(i); });
    /* Mouse out restores the current auto-cycle card */
    a.addEventListener('mouseleave',  function () { setDisplay(current); });
  });

  /* ── Advance current ── */
  function goTo(next) {
    if (next === current) return;
    var prevBar = cardEls[current].querySelector('.bento-card-bar');
    if (prevBar) prevBar.style.setProperty('--bar-w', '0%');
    cardEls[current].classList.remove('active');
    cardEls[next].classList.add('active');
    current = next;
    setDisplay(current);
    if (!paused) startBar();
  }

  function advance() { goTo((current + 1) % slides.length); }

  /* ── Gallery-wide pause on hover ── */
  gallery.addEventListener('mouseenter', function () { if (!paused) { paused = true;  pauseBar(); } });
  gallery.addEventListener('mouseleave', function () { if (paused)  { paused = false; resumeBar(); } });

  /* ── RAF progress bar ── */
  var barRaf = null, barEl = null, barElapsed = 0, barT0 = null;

  function startBar() {
    cancelAnimationFrame(barRaf);
    barElapsed = 0; barT0 = null;
    barEl = cardEls[current].querySelector('.bento-card-bar');
    if (barEl) barEl.style.setProperty('--bar-w', '0%');
    tickBar();
  }

  function tickBar() {
    barRaf = requestAnimationFrame(function (t) {
      if (barT0 === null) barT0 = t;
      var total = barElapsed + (t - barT0);
      var pct   = Math.min(total / DISPLAY_MS * 100, 100);
      if (barEl) barEl.style.setProperty('--bar-w', pct + '%');
      if (pct < 100) { tickBar(); } else { advance(); }
    });
  }

  function pauseBar() {
    cancelAnimationFrame(barRaf); barRaf = null;
    if (barT0 !== null) { barElapsed += performance.now() - barT0; barT0 = null; }
  }

  function resumeBar() { barT0 = null; tickBar(); }

  /* ── Equalize card heights across all rows ── */
  function equalizeHeights() {
    cardEls.forEach(function(el) { el.style.minHeight = ''; });
    var maxH = cardEls.reduce(function(m, el) { return Math.max(m, el.offsetHeight); }, 0);
    if (maxH > 0) cardEls.forEach(function(el) { el.style.minHeight = maxH + 'px'; });
  }

  window.addEventListener('resize', equalizeHeights);
  /* Run after layout is complete */
  requestAnimationFrame(equalizeHeights);

  setDisplay(0);
  startBar();
}());
</script>
