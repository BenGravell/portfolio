<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="{{ site.theme_color | default: '#ffffff' }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/app.css">
    <link
        rel="shortcut icon"
        type="image/png"
        {% if site.favicon %}
            href="{{ site.favicon | relative_url }}"
        {% else %}
            href="{{ site.baseurl }}/favicon.png"
        {% endif %}
    >
    <script defer src="https://unpkg.com/alpinejs@3.9.0/dist/cdn.min.js"></script>
    <!--
      Copy of bulma-clean-theme's _includes/head.html, overridden solely to pin
      Font Awesome at 6.7.2 (the theme ships 5.x). 6.7.2 is the newest release
      that is a drop-in for the site's FA5 usage — it keeps variable-width icons
      and the v5 class aliases (fa-external-link-alt, fa-file-alt) while adding
      the brand `fa-google-scholar` icon. FA 7.x is intentionally avoided: it
      makes every icon fixed-width (1.25em) by default, which would change inline
      icon spacing site-wide. If the theme gem is upgraded, re-sync this file.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    {% unless site.hide_share_buttons %}
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-social@1/bin/bulma-social.min.css">
    {% endunless %}
    {% seo %}
    {% if site.feed %}
        {% feed_meta %}
    {% endif %}
    {%- if site.google_analytics -%}
        {%- include google-analytics.html -%}
    {%- endif -%}
    {%- include head-scripts.html -%}
</head>
