<div class="bento-gallery" id="bento-gallery">
  <div class="gallery-main" id="gallery-main">
    <!-- Hover overlay: fades + desaturates content and invites click -->
    <div id="gallery-hover-overlay" aria-hidden="true">
      <div id="gallery-hover-circle">
        <i class="fas fa-external-link-alt"></i>
      </div>
    </div>
    <!-- Icon overlay fallback -->
    <div id="gallery-icon-overlay" aria-hidden="true">
      <i id="gallery-icon-fa" class="fas"></i>
      <div id="gallery-icon-label"></div>
    </div>
    <!-- Live-page iframe preview (Publications, Knowledge Base) -->
    <div id="gallery-mini-preview">
    </div>
  </div>
  <div class="bento-grid" id="bento-grid"></div>
</div>

<style>
/* ─── Outer container ─── */
.bento-gallery {
  width: 100%;
  position: relative;
}

/* ─── Main preview area ─── */
.gallery-main {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
  overflow: hidden;
  background: #0a0a0a;
  transition: background 0.2s ease;
}

/* ─── Stacked page-image strip (CV) ─── */
/* Full-bleed pages hosted in this repo — no gutters, no third-party viewer.
   The strip is taller than the box; the scroll-through animation translates
   it upward, ending exactly at the bottom of the last page. */
.gallery-pages {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  display: none;
  pointer-events: none; /* swipe/scroll passes through to the page */
}
.gallery-pages img {
  display: block;
  width: 100%;
  height: auto;
}
.gallery-pages img + img {
  margin-top: 6px; /* thin separator line between pages */
}

/* ─── Static / animated image preview ─── */
.gallery-slide-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
  pointer-events: none; /* swipe/scroll passes through to the page */
}

/* ─── Hover overlay: dims + desaturates content, circle icon invites click ─── */
#gallery-hover-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.22s ease;
  pointer-events: none;
  z-index: 5;
  background: rgba(10, 10, 10, 0.10);
  backdrop-filter: brightness(0.42) contrast(0.9) saturate(0.12);
  -webkit-backdrop-filter: brightness(0.42) contrast(0.9) saturate(0.12);
  cursor: pointer;
}
#gallery-hover-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}
#gallery-hover-circle {
  width: clamp(56px, 13%, 96px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  border: 2.5px solid rgba(255, 255, 255, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}
#gallery-hover-overlay:hover #gallery-hover-circle {
  background: rgba(255, 255, 255, 0.24);
  border-color: rgba(255, 255, 255, 0.96);
  transform: scale(1.06);
}
#gallery-hover-circle i {
  color: rgba(255, 255, 255, 0.90);
  font-size: clamp(1.1rem, 2.5vw, 1.9rem);
}

/* ─── Icon overlay (no-screenshot slides) ─── */
#gallery-icon-overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0.9rem;
  opacity: 0;
  transition: opacity 0.22s ease;
}
#gallery-icon-overlay.visible {
  opacity: 1;
}
#gallery-icon-fa {
  font-size: clamp(2.5rem, 8vw, 5rem);
  color: rgba(255, 255, 255, 0.80);
}
#gallery-icon-label {
  color: rgba(255, 255, 255, 0.65);
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(0.9rem, 2.5vw, 1.35rem);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─── Mini page preview ─── */
#gallery-mini-preview {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: transparent;
  display: none;
  opacity: 0;
  transition: opacity 0.22s ease;
}
#gallery-mini-preview.visible {
  opacity: 1;
}

/* ─── Bento card grid ─── */
/* container-type lets @container rules respond to the gallery's actual width,
   not the viewport — needed because the gallery is a column in a two-col layout. */
.bento-gallery {
  container-type: inline-size;
}

/* minmax(0,1fr): equal-width tracks that never overflow their container. */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  margin-top: 0.9rem;
}

/* Drop to 2 columns on narrow containers so cards remain readable. */
@container (max-width: 479px) {
  .bento-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Tighten cards at the 2-col breakpoint so titles fit without clipping. */
@container (max-width: 479px) {
  .bento-card { padding: 10px 9px; }
  .bento-card-icon { font-size: 1rem; }
  .bento-card-title { font-size: 0.78rem; }
}

/* ─── Full-cell hit area wrapping each card ─── */
.bento-cell {
  padding: 4px;
  display: flex;
  flex-direction: column;
  position: relative;
  cursor: pointer;
  user-select: none;
  transition: transform 0.18s;
}
.bento-cell:hover { transform: translateY(-2px); }

/* ─── Individual card ─── */
.bento-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  background: rgba(255, 255, 255, 0.07);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 14px 12px;
  flex: 1;
  transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
  flex-direction: column;
  gap: 0.35rem;
}

.bento-cell:hover .bento-card {
  background: rgba(255, 255, 255, 0.10);
  border-color: rgba(255, 255, 255, 0.85);
}
.bento-cell:hover .bento-card .bento-card-icon  { color: rgba(255, 255, 255, 0.88); }
.bento-cell:hover .bento-card .bento-card-title { color: #fff; }

.bento-card.active {
  --badge-color: rgba(255, 255, 255, 0.82);
  background: rgba(255, 255, 255, 0.10);
  border-color: var(--badge-color);
}

.bento-cell:hover .bento-card.active {
  --badge-color: rgba(255, 255, 255, 0.97);
  background: rgba(255, 255, 255, 0.22);
  border-color: var(--badge-color);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
}

/* ─── Card icon ─── */
.bento-card-icon {
  font-size: 1.15rem;
  color: rgba(255, 255, 255, 0.35);
  line-height: 1;
}
.bento-card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.42);
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: break-word;
  text-align: center;
}
.bento-card.active .bento-card-icon  { color: rgba(255, 255, 255, 0.88); }
.bento-card.active .bento-card-title { color: #fff; }

/* ─── Open notification badge (top-right of active card) ─── */
/* Badge is a child of .bento-cell (not .bento-card) so the card's
   overflow:hidden never clips it. top/right equal the cell's 4px padding,
   placing the badge flush with the card's outer corner.
   border-radius matches the card's outer border-radius on both rounded corners. */
/* Propagate --badge-color to the cell so the badge (a cell child) can
   inherit it — the card's own declaration only reaches card descendants. */
.bento-cell:has(.bento-card.active)       { --badge-color: rgba(255, 255, 255, 0.82); }
.bento-cell:hover:has(.bento-card.active) { --badge-color: rgba(255, 255, 255, 0.97); }

.bento-card-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 26px;
  height: 26px;
  background: var(--badge-color, rgba(255, 255, 255, 0.82));
  border-radius: 0 10px 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.18s ease, transform 0.18s ease, background 0.15s ease;
  pointer-events: none;
  z-index: 2;
}
.bento-card-badge i {
  color: #026bac;
  font-size: 0.68rem;
  line-height: 1;
}
.bento-cell:has(.bento-card.active) .bento-card-badge {
  opacity: 1;
  transform: scale(1);
}

/* Progress bar on the active card, driven by --bar-w */
.bento-card-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 8px;
  width: var(--bar-w, 0%);
  background: var(--badge-color, rgba(255, 255, 255, 0.82));
  border-radius: 0 1px 1px 0;
}
</style>

<script>
(function () {
  var DISPLAY_MS = 7500;
  var HOVER_SELECT_MS = 500;  /* dwell on a card this long and it auto-selects */
  var IFRAME_W   = 1400;  /* iframe content width rendered at full resolution */
  var IFRAME_H   = 800;   /* iframe content height (top portion visible) */
  var BASE = '{{ site.baseurl }}';

  // ── Slide definitions ──────────────────────────────────────────────────────
  var slides = [
    {
      title:    "Apps",
      subtitle: "Interactive Tools & Demos",
      link:     "/apps",
      bg:       "#080808",
      imgSrc:   BASE + "/assets/animations/nanotree.webp",
      imgFallback: BASE + "/assets/images/app/nanotree.png",
      icon:     "fa-route"
    },
    {
      title:    "Publications",
      subtitle: "My Peer Reviewed Research",
      link:     "/publications",
      bg:       "#0b1a2c",
      icon:     "fa-book-open",
      iframeSrc: BASE + "/publications",
      scrollPreview: true
    },
    {
      title:    "Curriculum Vitae",
      subtitle: "My Academic & Professional History",
      link:     "/cv",
      bg:       "#140a1f",
      icon:     "fa-file-alt",
      /* Page images are kept in sync with the Drive CV by
         .github/workflows/sync-cv-images.yml; this list is generated at
         Jekyll build time from whatever pages exist in assets/images/cv.
         (pdftoppm zero-pads page numbers when there are 10+, so a
         lexicographic path sort is always page order.) */
      pagesSrc: [
        {%- assign cv_pages = site.static_files | where_exp: "f", "f.path contains '/assets/images/cv/cv-page-'" | sort: "path" -%}
        {%- for f in cv_pages %}"{{ site.baseurl }}{{ f.path }}"{% unless forloop.last %}, {% endunless %}{%- endfor -%}
      ],
      scrollPreview: true
    },
    {
      title:    "Knowledge Base",
      subtitle: "Curated Research You Can Actually Navigate",
      link:     "https://bengravell.github.io/knowledge-base/",
      bg:       "#f0f4f8",
      icon:     "fa-brain",
      external: true,
      imgSrc:   BASE + "/assets/animations/knowledge_base.webp",
      imgFallback: BASE + "/assets/animations/knowledge_base.png"
    }
  ];

  var gallery    = document.getElementById('bento-gallery');
  var mainArea   = document.getElementById('gallery-main');
  var overlay    = document.getElementById('gallery-icon-overlay');
  var overlayFa  = document.getElementById('gallery-icon-fa');
  var overlayLbl = document.getElementById('gallery-icon-label');
  var miniArea   = document.getElementById('gallery-mini-preview');
  var hoverOverlay = document.getElementById('gallery-hover-overlay');
  var grid         = document.getElementById('bento-grid');

  var cardEls = [];
  var current  = 0;
  var paused   = false;
  var pinned   = false; /* a clicked card stays selected until another click */
  var _touching = false;
  var _hoverRevertTimer = null;
  var _hoverSelectTimer = null;

  /* ── Create stacked page-image strips for pagesSrc slides (CV) ── */
  var pagesMap = {};
  slides.forEach(function (data, i) {
    if (!data.pagesSrc) return;
    var wrap = document.createElement('div');
    wrap.className = 'gallery-pages';
    data.pagesSrc.forEach(function (src, n) {
      var img = document.createElement('img');
      img.src = src;
      img.alt = data.title + ' page ' + (n + 1);
      wrap.appendChild(img);
    });
    mainArea.appendChild(wrap);
    pagesMap[i] = wrap;
  });

  /* ── Create scaled page-preview iframes for section slides ── */
  var iframeMap = {};
  slides.forEach(function (data, i) {
    if (!data.iframeSrc) return;
    var fr = document.createElement('iframe');
    fr.src = data.iframeSrc;
    fr.setAttribute('scrolling', 'no');
    /* pointer-events:none lets wheel/touch-swipe pass through to the page
       instead of being captured by the embedded document; the drift animation
       still scrolls it programmatically. The hover overlay above handles clicks. */
    fr.style.cssText = 'position:absolute;top:0;left:0;width:' + IFRAME_W + 'px;height:' + IFRAME_H + 'px;border:none;display:none;transform-origin:top left;pointer-events:none;';
    fr.addEventListener('load', (function () {
      return function () {
        try {
          var doc = fr.contentDocument;
          var hideStyle = doc.createElement('style');
          hideStyle.textContent = 'nav.navbar, section.hero { display: none !important; } body { padding-top: 0 !important; } section.section { padding-top: 0 !important; padding-left: 0 !important; padding-right: 0 !important; } .container { max-width: 100% !important; margin-left: 0 !important; margin-right: 0 !important; padding-left: 0 !important; padding-right: 0 !important; } .columns { margin-left: 0 !important; margin-right: 0 !important; } .column { padding-left: 2rem !important; padding-right: 2rem !important; } .pub-grid { padding-top: 1rem !important; } html { scroll-behavior: auto !important; scrollbar-width: none !important; } ::-webkit-scrollbar { display: none !important; }';
          doc.head.appendChild(hideStyle);
        } catch(e) {}
      };
    }()));
    miniArea.appendChild(fr);
    iframeMap[i] = fr;
  });

  /* ── Create static / animated cover images for imgSrc slides ── */
  var imgMap = {};
  slides.forEach(function (data, i) {
    if (!data.imgSrc) return;
    var img = document.createElement('img');
    img.src = data.imgSrc;
    img.className = 'gallery-slide-img';
    img.alt = data.title;
    /* Fall back to a static .png if the animated .webp fails to load */
    img.onerror = function () {
      var fallback = data.imgFallback || data.imgSrc.replace(/\.webp$/i, '.png');
      if (img.src !== fallback) img.src = fallback;
    };
    mainArea.appendChild(img);
    imgMap[i] = img;
  });

  /* ── Scale page-preview iframes to fill the preview box ── */
  function updateMiniScale() {
    var w = miniArea.clientWidth;
    var h = miniArea.clientHeight;
    if (!w) return;
    /* On narrow containers, shrink the render width so the page's responsive
       breakpoints (mobile layout) kick in rather than scaling down a desktop
       view. Multiplier 1.4 keeps renderW below 600px on phone-width containers,
       which triggers pub-grid's single-column reflow (breakpoint: max-width 600px). */
    var renderW = Math.min(IFRAME_W, Math.max(w * 1.2, 480));
    var scale = w / renderW;
    var scaledH = h > 0 ? Math.ceil(h / scale) : IFRAME_H;
    Object.keys(iframeMap).forEach(function (k) {
      var fr = iframeMap[k];
      fr.style.width  = renderW + 'px';
      fr.style.height = scaledH + 'px';
      fr.style.transform = 'scale(' + scale.toFixed(4) + ')';
    });
  }

  /* ── Hide all page strips, page iframes, and cover images ── */
  function hideAllIframes() {
    Object.keys(pagesMap).forEach(function (k) { pagesMap[k].style.display = 'none'; });
    Object.keys(iframeMap).forEach(function (k) { iframeMap[k].style.display = 'none'; });
    Object.keys(imgMap).forEach(function (k) { imgMap[k].style.display = 'none'; });
  }

  /* ── Scroll-through preview animation ─────────────────────────────────────
     scrollPreview slides drift through their content on their own clock,
     ping-ponging forever: top → bottom → top → … It runs whenever the slide
     is on screen, independent of the auto-advance bar — so a clicked card
     keeps animating while the pointer rests on the gallery (where the bar is
     paused).
     Speed is expressed in preview-box heights per second (not absolute px),
     so the drift covers the same fraction of the visible window per second on
     a large desktop canvas and a small phone canvas. Geometry is re-read
     every frame, so window resizes and orientation changes adapt live.
     Publications iframe is same-origin → scroll its document directly.
     CV page-image strips are translated upward inside the clipped box. */
  var SCROLL_SPEED = 0.15; /* preview-box heights per second */
  var REDUCED_MOTION = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var displayedIdx = 0;
  var scrollRaf = null, scrollPos = 0, scrollDir = 1, scrollPrevT = null;
  var scrollHoverPause = false; /* pointer/touch on the canvas holds the drift */

  /* Scrollable range of slide i in on-screen px, plus how to apply a position */
  function scrollRange(i) {
    var boxH = mainArea.clientHeight;
    if (!boxH) return null;
    var el = pagesMap[i];
    if (el) return { max: el.offsetHeight - boxH, el: el, translate: true };
    var fr = iframeMap[i];
    if (fr) {
      try {
        var se = fr.contentDocument.scrollingElement || fr.contentDocument.documentElement;
        /* The iframe is scaled down on screen — express its range in
           on-screen px so the perceived speed matches the page-strip slide. */
        var scale = (fr.offsetWidth > 0 ? fr.getBoundingClientRect().width / fr.offsetWidth : 1) || 1;
        return { max: (se.scrollHeight - se.clientHeight) * scale, se: se, scale: scale };
      } catch (e) {}
    }
    return null;
  }

  function applyScroll(r, pos) {
    if (r.translate) r.el.style.transform = 'translateY(' + (-pos).toFixed(1) + 'px)';
    else r.se.scrollTop = pos / r.scale;
  }

  function scrollTick(t) {
    scrollRaf = requestAnimationFrame(scrollTick);
    if (scrollPrevT === null) { scrollPrevT = t; return; }
    var dt = Math.min((t - scrollPrevT) / 1000, 0.2); /* clamp jump after backgrounded tab */
    scrollPrevT = t;
    if (scrollHoverPause) return; /* clock keeps ticking, so resume has no jump */
    var boxH = mainArea.clientHeight;
    if (!boxH) return;
    var r = scrollRange(displayedIdx);
    if (!r || r.max <= 0) return;
    scrollPos += scrollDir * SCROLL_SPEED * boxH * dt;
    if (scrollPos >= r.max) { scrollPos = r.max; scrollDir = -1; }
    else if (scrollPos <= 0) { scrollPos = 0; scrollDir = 1; }
    applyScroll(r, scrollPos);
  }

  /* Called from setDisplay: restart the drift from the top when a different
     slide comes on screen, and run the loop only while a scrollPreview slide
     is displayed. */
  function syncScrollAnim(i) {
    if (i !== displayedIdx) {
      displayedIdx = i;
      scrollPos = 0; scrollDir = 1;
      if (slides[i].scrollPreview) {
        var r = scrollRange(i);
        if (r) applyScroll(r, 0);
      }
    }
    if (slides[i].scrollPreview && !REDUCED_MOTION) {
      if (scrollRaf === null) { scrollPrevT = null; scrollRaf = requestAnimationFrame(scrollTick); }
    } else if (scrollRaf !== null) {
      cancelAnimationFrame(scrollRaf); scrollRaf = null;
    }
  }

  /* ── Display update ── */
  function setDisplay(i) {
    var data = slides[i];
    mainArea.style.background = data.bg;

    if (data.pagesSrc) {
      hideAllIframes();
      miniArea.classList.remove('visible');
      miniArea.style.display = 'none';
      overlay.classList.remove('visible');
      overlay.style.display = 'none';
      if (pagesMap[i]) pagesMap[i].style.display = 'block';
    } else if (data.imgSrc) {
      hideAllIframes();
      miniArea.classList.remove('visible');
      miniArea.style.display = 'none';
      overlay.classList.remove('visible');
      overlay.style.display = 'none';
      if (imgMap[i]) imgMap[i].style.display = 'block';
    } else if (data.iframeSrc) {
      hideAllIframes();
      overlay.classList.remove('visible');
      overlay.style.display = 'none';
      if (iframeMap[i]) iframeMap[i].style.display = 'block';
      miniArea.style.display = 'block';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          updateMiniScale();
          miniArea.classList.add('visible');
        });
      });
    } else {
      hideAllIframes();
      miniArea.classList.remove('visible');
      miniArea.style.display = 'none';
      overlayFa.className = 'fas ' + data.icon;
      overlayLbl.textContent = data.title;
      overlay.style.display = 'flex';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { overlay.classList.add('visible'); });
      });
    }

    syncScrollAnim(i);
  }

  /* ── Build bento cards ── */
  slides.forEach(function (data, i) {
    var card = document.createElement('div');
    card.className = 'bento-card' + (i === 0 ? ' active' : '');

    if (data.icon) {
      var ico = document.createElement('i');
      ico.className = 'fas ' + data.icon + ' bento-card-icon';
      card.appendChild(ico);
    }

    var t = document.createElement('div');
    t.className = 'bento-card-title';
    t.textContent = data.title;

    var bar = document.createElement('div');
    bar.className = 'bento-card-bar';

    var badge = document.createElement('div');
    badge.className = 'bento-card-badge';
    badge.setAttribute('aria-hidden', 'true');
    var badgeIco = document.createElement('i');
    badgeIco.className = 'fas fa-external-link-alt';
    badge.appendChild(badgeIco);

    card.appendChild(t);
    card.appendChild(bar);

    var cell = document.createElement('div');
    cell.className = 'bento-cell';
    cell.setAttribute('role', 'button');
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('aria-label', data.title + ': ' + data.subtitle);
    cell.appendChild(card);
    cell.appendChild(badge); /* badge on cell, not card — avoids card overflow:hidden clipping */
    grid.appendChild(cell);
    cardEls.push(card);

    cell.addEventListener('click', function () {
      if (_hoverSelectTimer) { clearTimeout(_hoverSelectTimer); _hoverSelectTimer = null; }
      if (i === current && pinned) openSlide(data);
      else pinCard(i);
    });
    cell.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (i === current && pinned) openSlide(data);
        else pinCard(i);
      }
    });
    /* Hover on the full cell; entering cancels any pending revert.
       Dwelling for HOVER_SELECT_MS commits the selection, same as a click. */
    cell.addEventListener('mouseenter', function () {
      if (_hoverRevertTimer) { clearTimeout(_hoverRevertTimer); _hoverRevertTimer = null; }
      if (_hoverSelectTimer) { clearTimeout(_hoverSelectTimer); _hoverSelectTimer = null; }
      setDisplay(i);
      if (i !== current && !pinned) {
        _hoverSelectTimer = setTimeout(function () {
          _hoverSelectTimer = null;
          if (i !== current) goTo(i);
        }, HOVER_SELECT_MS);
      }
    });
    /* Leaving starts a short grace window before reverting to the active card */
    cell.addEventListener('mouseleave', function () {
      if (_hoverSelectTimer) { clearTimeout(_hoverSelectTimer); _hoverSelectTimer = null; }
      _hoverRevertTimer = setTimeout(function () {
        _hoverRevertTimer = null;
        setDisplay(current);
      }, 80);
    });
  });

  cardEls[0].parentNode.setAttribute('aria-label', 'Select ' + slides[0].title + ' — ' + slides[0].subtitle);

  function openSlide(data) {
    var href = data.external ? data.link : BASE + data.link;
    window.location.assign(href);
  }

  /* A direct click is a persistent selection. The first click selects and
     stops auto-advance; clicking that selected card again follows its link. */
  function pinCard(next) {
    pinned = true;
    pauseBar();
    if (next !== current) goTo(next);
    else setDisplay(current);
    barElapsed = 0; barT0 = null;
    barEl = cardEls[current].querySelector('.bento-card-bar');
    if (barEl) barEl.style.setProperty('--bar-w', '0%');
    cardEls[current].parentNode.setAttribute('aria-label', 'Open ' + slides[current].title + ' — ' + slides[current].subtitle);
  }

  /* ── Advance current ── */
  function goTo(next) {
    if (next === current) return;
    cancelAnimationFrame(barRaf); barRaf = null;
    var prevBar = cardEls[current].querySelector('.bento-card-bar');
    if (prevBar) prevBar.style.setProperty('--bar-w', '0%');
    cardEls[current].classList.remove('active');
    cardEls[current].parentNode.setAttribute('aria-label', slides[current].title + ': ' + slides[current].subtitle);
    cardEls[next].classList.add('active');
    cardEls[next].parentNode.setAttribute('aria-label', 'Open ' + slides[next].title + ' — ' + slides[next].subtitle);
    current = next;
    barElapsed = 0; barT0 = null;
    setDisplay(current);
    barEl = cardEls[current].querySelector('.bento-card-bar');
    if (barEl) barEl.style.setProperty('--bar-w', '0%');
    if (!paused && !pinned) tickBar();
  }

  function advance() { goTo((current + 1) % slides.length); }

  /* ── Gallery-wide pause on hover / touch ────────────────────────────────
     Iframes are a separate browsing context, so the browser fires mouseleave
     on the gallery when the pointer enters them. We debounce the resume so that
     quick re-entries (iframe ↔ gallery) don't flicker the auto-advance.
     On touch devices a touchstart on the iframe element does bubble to the
     gallery, but the synthesised mouseleave fires immediately afterwards and
     would resume the bar before the touch ends. _touching suppresses that.   */
  var _galleryLeaveTimer = null;
  gallery.addEventListener('mouseenter', function () {
    if (_galleryLeaveTimer) { clearTimeout(_galleryLeaveTimer); _galleryLeaveTimer = null; }
    if (!paused) { paused = true; pauseBar(); }
  });
  gallery.addEventListener('mouseleave', function () {
    _galleryLeaveTimer = setTimeout(function () {
      _galleryLeaveTimer = null;
      if (paused && !_touching) { paused = false; resumeBar(); }
    }, 350);
  });
  gallery.addEventListener('touchstart', function () {
    _touching = true;
    if (_galleryLeaveTimer) { clearTimeout(_galleryLeaveTimer); _galleryLeaveTimer = null; }
    if (!paused) { paused = true; pauseBar(); }
  }, { passive: true });
  function _onTouchEnd() {
    _touching = false;
    _galleryLeaveTimer = setTimeout(function () {
      _galleryLeaveTimer = null;
      if (paused) { paused = false; resumeBar(); }
    }, 350);
  }
  gallery.addEventListener('touchend',    _onTouchEnd, { passive: true });
  gallery.addEventListener('touchcancel', _onTouchEnd, { passive: true });

  /* ── Hover overlay on the preview area — shows a dimmed fade + open icon ──
     Pointer (or touch) on the canvas also holds the scroll-through drift so
     the content can be read while it's inspected. */
  mainArea.addEventListener('mouseenter', function () {
    hoverOverlay.classList.add('visible');
    scrollHoverPause = true;
  });
  mainArea.addEventListener('mouseleave', function () {
    hoverOverlay.classList.remove('visible');
    scrollHoverPause = false;
  });
  mainArea.addEventListener('touchstart', function () { scrollHoverPause = true; },  { passive: true });
  mainArea.addEventListener('touchend',   function () { scrollHoverPause = false; }, { passive: true });
  mainArea.addEventListener('touchcancel',function () { scrollHoverPause = false; }, { passive: true });
  hoverOverlay.addEventListener('click', function () {
    openSlide(slides[current]);
  });

  /* ── RAF progress bar ── */
  var barRaf = null, barEl = null, barElapsed = 0, barT0 = null;

  function startBar() {
    cancelAnimationFrame(barRaf);
    barElapsed = 0; barT0 = null;
    barEl = cardEls[current].querySelector('.bento-card-bar');
    if (barEl) barEl.style.setProperty('--bar-w', '0%');
    tickBar();
  }

  function tickBar() {
    barRaf = requestAnimationFrame(function (t) {
      if (barT0 === null) barT0 = t;
      var total = barElapsed + (t - barT0);
      var pct   = Math.min(total / DISPLAY_MS * 100, 100);
      if (barEl) barEl.style.setProperty('--bar-w', pct + '%');
      if (pct < 100) { tickBar(); } else { advance(); }
    });
  }

  function pauseBar() {
    cancelAnimationFrame(barRaf); barRaf = null;
    if (barT0 !== null) { barElapsed += performance.now() - barT0; barT0 = null; }
  }

  function resumeBar() {
    if (pinned) return;
    barT0 = null;
    tickBar();
  }

  window.addEventListener('resize', updateMiniScale);

  setDisplay(0);
  startBar();
}());
</script>
