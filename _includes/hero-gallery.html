<div class="bento-gallery" id="bento-gallery">
  <div class="gallery-main" id="gallery-main">
    <img id="gallery-main-img" src="" alt="" draggable="false">
    <!-- Icon overlay for section slides (Teaching, CV) that have no screenshot -->
    <div id="gallery-icon-overlay" aria-hidden="true">
      <i id="gallery-icon-fa" class="fas"></i>
      <div id="gallery-icon-label"></div>
    </div>
  </div>
  <div class="gallery-caption">
    <a class="gallery-caption-title" id="gallery-title" href="#"></a>
    <span class="gallery-caption-subtitle" id="gallery-subtitle"></span>
  </div>
  <div class="bento-grid" id="bento-grid"></div>
</div>

<style>
/* ─── Outer container ─── */
.bento-gallery {
  width: 100%;
  position: relative;
}

/* ─── Main preview area ─── */
.gallery-main {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
  background: #0a0a0a;
  transition: background 0.2s ease;
}

/* Responsive inset: percentage keeps margin proportional at any size */
.gallery-main img {
  position: absolute;
  inset: 5%;
  width: 90%;
  height: 90%;
  object-fit: contain;
  display: block;
  transition: opacity 0.18s ease;
}

.gallery-main img.fading {
  opacity: 0;
}

/* ─── Icon overlay (no-screenshot slides) ─── */
#gallery-icon-overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0.9rem;
  opacity: 0;
  transition: opacity 0.22s ease;
}
#gallery-icon-overlay.visible {
  opacity: 1;
}
#gallery-icon-fa {
  font-size: clamp(2.5rem, 8vw, 5rem);
  color: rgba(255, 255, 255, 0.80);
}
#gallery-icon-label {
  color: rgba(255, 255, 255, 0.65);
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(0.9rem, 2.5vw, 1.35rem);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─── Caption ─── */
.gallery-caption {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0 0.6rem;
  margin-top: 0.55rem;
  margin-bottom: 0.55rem;
  min-height: 1.5rem;
}

.gallery-caption-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
}

.gallery-caption-title:hover {
  text-decoration: underline;
  color: #fff;
}

.gallery-caption-subtitle {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.75);
}

/* ─── Bento card grid — 3 cols on desktop, 2 on mobile (6 items = 2×3 / 3×2) ─── */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

@media (max-width: 768px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ─── Individual card ─── */
.bento-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 12px 12px 16px;
  min-height: 0;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  flex-direction: column;
  gap: 0.35rem;
}

.bento-card:hover {
  background: rgba(255, 255, 255, 0.13);
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-2px);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

.bento-card.active {
  background: rgba(0, 168, 150, 0.14);
  border-color: #00a896;
  box-shadow: 0 0 0 1px rgba(0, 168, 150, 0.3);
}

.bento-card.active:hover {
  background: rgba(0, 168, 150, 0.2);
  border-color: #00c4b0;
}

/* ─── Section-type cards (Teaching, CV) get a subtle icon ─── */
.bento-card-icon {
  font-size: 1.15rem;
  color: rgba(255, 255, 255, 0.70);
  line-height: 1;
}

.bento-card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-align: center;
}

/* Progress bar on the active card, driven by --bar-w */
.bento-card-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 8px;
  width: var(--bar-w, 0%);
  background: linear-gradient(90deg, #00a896, #2ab3e7);
  border-radius: 0 1px 1px 0;
}
</style>

<script>
(function () {
  var DISPLAY_MS = 5000;
  var BASE = '{{ site.baseurl }}';

  // ── Slide definitions ──────────────────────────────────────────────────────
  // img: path relative to BASE, or null for icon-only slides
  // icon: Font Awesome class (e.g. "fa-graduation-cap") for icon-only slides
  var slides = [
    {
      title:    "Nanotree",
      subtitle: "Interactive Realtime Path Planning",
      link:     "/nanotree",
      bg:       "#080808",
      img:      BASE + "/assets/images/app/nanotree.png"
    },
    {
      title:    "Mosaic Maker",
      subtitle: "Make Mosaics from Thousands of Images",
      link:     "/mosaic-maker",
      bg:       "#ffffff",
      img:      BASE + "/assets/images/app/mosaic-maker.png"
    },
    {
      title:    "Cartpole Control",
      subtitle: "Swing Up a Cartpole with Optimal Control",
      link:     "/cartpole-optimal-control",
      bg:       "#f8f8f8",
      img:      BASE + "/assets/images/app/cartpole-optimal-control.png"
    },
    {
      title:    "Publications",
      subtitle: "Research in Control, Robotics & ML",
      link:     "/publications",
      bg:       "#0b1a2c",
      img:      BASE + "/assets/images/pub/2022_gravell_data_driven_control_and.jpg"
    },
    {
      title:    "Teaching",
      subtitle: "Courses & Educational Materials",
      link:     "/teaching",
      bg:       "#091a10",
      img:      null,
      icon:     "fa-graduation-cap"
    },
    {
      title:    "CV",
      subtitle: "Academic & Professional Background",
      link:     "/cv",
      bg:       "#140a1f",
      img:      null,
      icon:     "fa-file-alt"
    }
  ];

  var gallery    = document.getElementById('bento-gallery');
  var mainArea   = document.getElementById('gallery-main');
  var mainImg    = document.getElementById('gallery-main-img');
  var overlay    = document.getElementById('gallery-icon-overlay');
  var overlayFa  = document.getElementById('gallery-icon-fa');
  var overlayLbl = document.getElementById('gallery-icon-label');
  var titleEl    = document.getElementById('gallery-title');
  var subtitleEl = document.getElementById('gallery-subtitle');
  var grid       = document.getElementById('bento-grid');

  var cardEls = [];
  var current = 0;
  var paused  = false;

  /* ── Display update ── */
  function setDisplay(i) {
    var data = slides[i];
    titleEl.textContent    = data.title;
    titleEl.href           = BASE + data.link;
    subtitleEl.textContent = data.subtitle;
    mainArea.style.background = data.bg;

    if (data.img) {
      // Image slide: hide overlay, show image
      overlay.classList.remove('visible');
      setTimeout(function () { overlay.style.display = 'none'; }, 220);

      if (mainImg.getAttribute('data-current-src') === data.img) {
        mainImg.style.display = '';
        return;
      }
      mainImg.style.display = '';
      mainImg.classList.add('fading');
      setTimeout(function () {
        mainImg.src = data.img;
        mainImg.setAttribute('data-current-src', data.img);
        mainImg.alt = data.title;
        mainImg.onload  = function () { mainImg.classList.remove('fading'); };
        mainImg.onerror = function () { mainImg.classList.remove('fading'); };
      }, 180);
    } else {
      // Icon slide: hide image, show overlay
      mainImg.style.display = 'none';
      overlayFa.className = 'fas ' + data.icon;
      overlayLbl.textContent = data.title;
      overlay.style.display = 'flex';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { overlay.classList.add('visible'); });
      });
    }
  }

  /* ── Build bento cards ── */
  slides.forEach(function (data, i) {
    var a = document.createElement('a');
    a.className = 'bento-card' + (i === 0 ? ' active' : '');
    a.href = BASE + data.link;
    a.setAttribute('aria-label', data.title + ': ' + data.subtitle);

    // For icon-only slides, add a small icon above the title
    if (!data.img && data.icon) {
      var ico = document.createElement('i');
      ico.className = 'fas ' + data.icon + ' bento-card-icon';
      a.appendChild(ico);
    }

    var t = document.createElement('div');
    t.className = 'bento-card-title';
    t.textContent = data.title;

    var bar = document.createElement('div');
    bar.className = 'bento-card-bar';

    a.appendChild(t);
    a.appendChild(bar);
    grid.appendChild(a);
    cardEls.push(a);

    /* Hover previews this card without changing current */
    a.addEventListener('mouseenter', function () { setDisplay(i); });
    /* Mouse out restores the current auto-cycle card */
    a.addEventListener('mouseleave',  function () { setDisplay(current); });
  });

  /* ── Advance current ── */
  function goTo(next) {
    if (next === current) return;
    var prevBar = cardEls[current].querySelector('.bento-card-bar');
    if (prevBar) prevBar.style.setProperty('--bar-w', '0%');
    cardEls[current].classList.remove('active');
    cardEls[next].classList.add('active');
    current = next;
    setDisplay(current);
    if (!paused) startBar();
  }

  function advance() { goTo((current + 1) % slides.length); }

  /* ── Gallery-wide pause on hover ── */
  gallery.addEventListener('mouseenter', function () { if (!paused) { paused = true;  pauseBar(); } });
  gallery.addEventListener('mouseleave', function () { if (paused)  { paused = false; resumeBar(); } });

  /* ── RAF progress bar ── */
  var barRaf = null, barEl = null, barElapsed = 0, barT0 = null;

  function startBar() {
    cancelAnimationFrame(barRaf);
    barElapsed = 0; barT0 = null;
    barEl = cardEls[current].querySelector('.bento-card-bar');
    if (barEl) barEl.style.setProperty('--bar-w', '0%');
    tickBar();
  }

  function tickBar() {
    barRaf = requestAnimationFrame(function (t) {
      if (barT0 === null) barT0 = t;
      var total = barElapsed + (t - barT0);
      var pct   = Math.min(total / DISPLAY_MS * 100, 100);
      if (barEl) barEl.style.setProperty('--bar-w', pct + '%');
      if (pct < 100) { tickBar(); } else { advance(); }
    });
  }

  function pauseBar() {
    cancelAnimationFrame(barRaf); barRaf = null;
    if (barT0 !== null) { barElapsed += performance.now() - barT0; barT0 = null; }
  }

  function resumeBar() { barT0 = null; tickBar(); }

  /* ── Equalize card heights across all rows ── */
  function equalizeHeights() {
    cardEls.forEach(function(el) { el.style.minHeight = ''; });
    var maxH = cardEls.reduce(function(m, el) { return Math.max(m, el.offsetHeight); }, 0);
    if (maxH > 0) cardEls.forEach(function(el) { el.style.minHeight = maxH + 'px'; });
  }

  window.addEventListener('resize', equalizeHeights);
  requestAnimationFrame(equalizeHeights);

  setDisplay(0);
  startBar();
}());
</script>
